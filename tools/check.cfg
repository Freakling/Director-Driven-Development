; App Director check settings · project-owned: onboarding fills it in; edit freely.
; Paths are relative to the repository root. Lists are space-separated. Comments on their own lines.

[project]
; Stack: typescript | flutter | python | none
stack = none

[ui]
; Space-separated list of UI-layer folders (screens, pages, components).
; The check fails when files here import from [data] dirs.
dirs =

[data]
; Space-separated list of data-layer folders (api, repositories, storage).
dirs =

[scan]
; Folders to skip in all checks. Space-separated.
skip = node_modules dist build .dart_tool __pycache__ .venv site init .claude/skills/app-director

[gitleaks]
; Minimum gitleaks version required by the secrets check and the pre-commit hook.
; Raise this after testing with a newer version if newer rules are needed.
min-version = 8.18.0
