site_name: Director-Driven Development
site_description: "How-to docs for Director-Driven Development: you direct, AI agents build, one automatic check proves every task. Covers App-Director, Godot-Director and SaaSAllTheThings. Built with App-Director."
site_url: https://freakling.github.io/Director-Driven-Development/
site_author: Vikingur Saemundsson
repo_url: https://github.com/Freakling/Director-Driven-Development
repo_name: Freakling/Director-Driven-Development
edit_uri: edit/main/docs/
copyright: © 2026 Vikingur Saemundsson · MIT licence · <a href="https://saemundsson.se">saemundsson.se</a>

theme:
  name: material
  font: false
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - search.highlight
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/ddd.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Concept:
      - concept/index.md
      - Roles: concept/roles.md
      - Design calls: concept/design-calls.md
      - Agent development flow: concept/agent-flow.md
      - The check: concept/check.md
      - Task and model sizing: concept/sizing.md
      - Reviews: concept/reviews.md
      - Records in files: concept/records.md
      - Code shaped for agents: concept/code-shape.md
      - Ownership: concept/ownership.md
      - Align and drift reset: concept/drift.md
      - Built-in cost savings: concept/cost-built-in.md
      - Cost tuning for developers: concept/cost-tuning.md
  - Skills:
      - skills/index.md
      - /next-task: skills/next-task.md
      - /design: skills/design.md
      - /ui-design: skills/ui-design.md
      - /research: skills/research.md
      - /align: skills/align.md
      - /drift-reset: skills/drift-reset.md
      - /prune: skills/prune.md
      - /refresh-model-sizing: skills/refresh-model-sizing.md
      - /release: skills/release.md
      - Acceptance check: skills/acceptance.md
  - How-to:
      - how-to/index.md
      - Start here:
          - "Where do I start with an app?": how-to/start.md
          - "Where do I start with a game?": how-to/start-game.md
          - "Where do I start with a SaaS?": how-to/start-saas.md
          - "I already have a project. Can I use this?": how-to/existing.md
      - Day to day:
          - "How do I get things built?": how-to/build.md
          - "How do I decide what gets built, or change how something works?": how-to/decide.md
          - "I need facts before I decide": how-to/facts.md
          - "How do I work with UI changes?": how-to/ui.md
          - "How do I check that what was built works?": how-to/check.md
          - "How do I ship it?": how-to/ship.md
          - "I want to change something. Which file is it in?": how-to/where.md
      - When things go wrong:
          - "Something isn't there, or doesn't work": how-to/trouble.md
          - "The system was not built as I intended": how-to/drift.md
          - "The records and the code don't agree": how-to/align.md
          - "The task list is getting long": how-to/prune.md
          - "It's costing more than I'd like": how-to/cost.md
  - Frameworks:
      - frameworks/index.md
      - App-Director: frameworks/app-director.md
      - Godot-Director: frameworks/godot-director.md
      - SaaSAllTheThings: frameworks/saasallthethings.md
  - Examples:
      - examples/index.md
      - "Game: PKSEI": examples/pksei.md
